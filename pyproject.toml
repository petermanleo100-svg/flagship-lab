[project]
name = "flagship-lab"
version = "0.1.0"
description = "Auditable multi-tenant tax, regulatory, controls, and graph-risk workflow platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "sqlalchemy==2.0.51",
  "PyJWT==2.13.0",
  "numpy==2.5.2",
  "scikit-learn==1.9.0",
  "networkx==3.6.1",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "cryptography==50.0.0",
  "opentelemetry-api==1.39.1",
  "opentelemetry-sdk==1.39.1",
  "opentelemetry-exporter-otlp-proto-http==1.39.1",
  "opentelemetry-instrumentation-fastapi==0.60b1",
  "opentelemetry-instrumentation-sqlalchemy==0.60b1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1", "pip-audit==2.10.1"]
kafka = ["confluent-kafka==2.15.0"]

[project.scripts]
flagship-lab = "flagship_lab.cli:main"
flagship-worker = "flagship_lab.worker:main"
flagship-operations = "flagship_lab.operations:main"


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
