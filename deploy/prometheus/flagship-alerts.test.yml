rule_files: [flagship-alerts.yml]
evaluation_interval: 1m
tests:
  - name: flagship-missing-backup-metric-fails-closed
    interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: FlagshipBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, service: flagship-lab, owner: platform-operations, operation: backup_create}
            exp_annotations: {summary: "Flagship has no successful backup inside the 15-minute RPO window", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
  - name: flagship-api-alerts-fire-after-sustained-breach
    interval: 1m
    input_series:
      - series: 'flagship_http_requests_total{status="200"}'
        values: '0+100x20'
      - series: 'flagship_http_requests_total{status="500"}'
        values: '0+5x20'
      - series: 'http_server_request_duration_seconds_bucket{service_name="flagship-lab",le="0.5"}'
        values: '0+10x20'
      - series: 'http_server_request_duration_seconds_bucket{service_name="flagship-lab",le="1"}'
        values: '0+20x20'
      - series: 'http_server_request_duration_seconds_bucket{service_name="flagship-lab",le="2"}'
        values: '0+100x20'
      - series: 'http_server_request_duration_seconds_bucket{service_name="flagship-lab",le="+Inf"}'
        values: '0+100x20'
      - series: 'probe_success{job="flagship-readiness"}'
        values: '0+0x25'
      - series: 'flagship_operation_success{operation="backup_create"}'
        values: '0+0x25'
      - series: 'flagship_operation_last_success_timestamp_seconds{operation="backup_create"}'
        values: '0+0x25'
    alert_rule_test:
      - eval_time: 16m
        alertname: FlagshipHighErrorRate
        exp_alerts:
          - exp_labels: {severity: critical, service: flagship-lab, owner: platform-operations}
            exp_annotations: {summary: "Flagship API 5xx rate exceeds 1%", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
      - eval_time: 16m
        alertname: FlagshipP95LatencyBudgetBurn
        exp_alerts:
          - exp_labels: {severity: warning, service: flagship-lab, owner: platform-operations}
            exp_annotations: {summary: "Flagship p95 latency exceeds one second", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
      - eval_time: 16m
        alertname: FlagshipReadinessUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, service: flagship-lab, owner: platform-operations, job: flagship-readiness}
            exp_annotations: {summary: "Flagship readiness probe is unavailable", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
      - eval_time: 21m
        alertname: FlagshipOperationFailed
        exp_alerts:
          - exp_labels: {severity: critical, service: flagship-lab, owner: platform-operations, operation: backup_create}
            exp_annotations: {summary: "Flagship scheduled operation failed", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
      - eval_time: 21m
        alertname: FlagshipBackupStale
        exp_alerts:
          - exp_labels: {severity: critical, service: flagship-lab, owner: platform-operations, operation: backup_create}
            exp_annotations: {summary: "Flagship has no successful backup inside the 15-minute RPO window", runbook_url: "https://github.com/petermanleo100-svg/flagship-lab/blob/main/docs/production-runbook.md"}
