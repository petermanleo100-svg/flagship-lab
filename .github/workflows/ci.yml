name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" prom/prometheus:v3.11.3 check rules /rules/flagship-alerts.yml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flagship
          POSTGRES_PASSWORD: flagship-ci-password
          POSTGRES_DB: flagship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagship -d flagship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAGSHIP_TEST_POSTGRES_URL: postgresql+psycopg://flagship:flagship-ci-password@127.0.0.1:5432/flagship
      FLAGSHIP_DATABASE_URL: postgresql+psycopg://flagship:flagship-ci-password@127.0.0.1:5432/flagship
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: alembic upgrade head
      - run: pytest -q tests/test_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --tag flagship-lab:ci .
      - run: docker inspect flagship-lab:ci --format '{{.Config.User}}' | grep -Fx flagship
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: flagship-lab:ci
          format: spdx-json
          output-file: flagship-lab-sbom.spdx.json
          upload-artifact: false
      - name: Block fixed critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: flagship-lab-sbom.spdx.json
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flagship-lab-sbom-${{ github.sha }}
          path: flagship-lab-sbom.spdx.json
          retention-days: 30

