name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
      - run: python -m pip check
      - name: Audit Python dependency vulnerabilities
        run: python scripts/verify_dependency_manifest.py && pip-audit -r requirements-audit.txt
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" prom/prometheus:v3.11.3 check rules /rules/flagship-alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/prometheus:/rules:ro" -w /rules prom/prometheus:v3.11.3 test rules flagship-alerts.test.yml

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flagship
          POSTGRES_PASSWORD: flagship-ci-password
          POSTGRES_DB: flagship
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flagship -d flagship"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLAGSHIP_TEST_POSTGRES_URL: postgresql+psycopg://flagship:flagship-ci-password@127.0.0.1:5432/flagship
      FLAGSHIP_DATABASE_URL: postgresql+psycopg://flagship:flagship-ci-password@127.0.0.1:5432/flagship
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: alembic upgrade head
      - run: pytest -q tests/test_postgres.py
      - name: Validate hardened Compose topology
        env:
          POSTGRES_OWNER_PASSWORD: owner-ci-password
          POSTGRES_APP_PASSWORD: app-ci-password
          FLAGSHIP_OIDC_ISSUER: https://id.example
          FLAGSHIP_OIDC_JWKS_URL: https://id.example/jwks
          FLAGSHIP_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag flagship-lab:ci .
      - run: docker run --rm --entrypoint python flagship-lab:ci --version | grep -Fx 'Python 3.13.15'
      - run: docker inspect flagship-lab:ci --format '{{.Config.User}}' | grep -Fx flagship
      - name: Generate SPDX SBOM
        id: sbom_primary
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: flagship-lab:ci
          format: spdx-json
          output-file: flagship-lab-sbom.spdx.json
          upload-artifact: false
      - name: Retry SPDX SBOM generation after transient download failure
        if: steps.sbom_primary.outcome == 'failure'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: flagship-lab:ci
          format: spdx-json
          output-file: flagship-lab-sbom.spdx.json
          upload-artifact: false
      - name: Require generated SPDX SBOM
        run: test -s flagship-lab-sbom.spdx.json
      - name: Validate time-bounded vulnerability exceptions
        run: python scripts/verify_vulnerability_exceptions.py
      - name: Block fixable High and Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: flagship-lab-sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          config: .grype.yaml
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flagship-lab-sbom-${{ github.sha }}
          path: flagship-lab-sbom.spdx.json
          retention-days: 30
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_OWNER_PASSWORD: owner-ci-password
      POSTGRES_APP_PASSWORD: app-ci-password
      FLAGSHIP_OIDC_ISSUER: https://id.example
      FLAGSHIP_OIDC_JWKS_URL: https://id.example/jwks
      FLAGSHIP_BACKUP_KEY_BASE64: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up --build --detach
      - name: Wait for hardened API readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - if: always()
        run: docker compose ps --all && docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes --remove-orphans

