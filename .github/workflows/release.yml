name: release-image

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  LOCAL_IMAGE: flagship-lab:candidate
  ARCHIVE_NAME: flagship-lab-image.tar.gz
  SBOM_NAME: flagship-lab-sbom.spdx.json

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Resolve release mode
        id: mode
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vMAJOR.MINOR.PATCH"; exit 1; }
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "version=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "version=candidate-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Require approved main commit gates before publication
        if: steps.mode.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          [[ "${main_sha}" == "${GITHUB_SHA}" ]] || { echo "tag must point to current main"; exit 1; }
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in backend postgres frontend container compose-smoke analyze; do
            jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name and .conclusion == "success")] | length > 0' <<<"${checks}" >/dev/null || { echo "missing successful ${required} gate"; exit 1; }
          done

      - name: Build candidate image
        if: steps.mode.outputs.publish == 'false'
        run: |
          docker build --tag "${LOCAL_IMAGE}" .
          docker inspect "${LOCAL_IMAGE}" --format '{{.Config.User}}' | grep -Ev '^(|0|root)$'
          docker save "${LOCAL_IMAGE}" | gzip -9 > "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Log in to GHCR
        if: steps.mode.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        if: steps.mode.outputs.publish == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Publish versioned image
        if: steps.mode.outputs.publish == 'true'
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.mode.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.mode.outputs.version }}

      - name: Generate candidate SBOM
        if: steps.mode.outputs.publish == 'false'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.LOCAL_IMAGE }}
          format: spdx-json
          output-file: ${{ env.SBOM_NAME }}
          upload-artifact: false

      - name: Generate published image SBOM
        if: steps.mode.outputs.publish == 'true'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.mode.outputs.version }}
          format: spdx-json
          output-file: ${{ env.SBOM_NAME }}
          upload-artifact: false

      - name: Record published immutable digest
        if: steps.mode.outputs.publish == 'true'
        run: echo "${{ steps.publish.outputs.digest }} ${{ env.IMAGE_NAME }}:${{ steps.mode.outputs.version }}" > image-digest.txt

      - name: Validate time-bounded vulnerability exceptions
        run: python scripts/verify_vulnerability_exceptions.py
      - name: Block fixable High and Critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          sbom: ${{ env.SBOM_NAME }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          config: .grype.yaml

      - name: Attest candidate archive provenance
        if: steps.mode.outputs.publish == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Attest candidate archive SBOM
        if: steps.mode.outputs.publish == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}
          sbom-path: ${{ env.SBOM_NAME }}

      - name: Attest published image provenance
        if: steps.mode.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-version: ${{ steps.mode.outputs.version }}
          push-to-registry: true

      - name: Attest published image SBOM
        if: steps.mode.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-version: ${{ steps.mode.outputs.version }}
          sbom-path: ${{ env.SBOM_NAME }}
          push-to-registry: true

      - name: Upload candidate bundle
        if: steps.mode.outputs.publish == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flagship-lab-candidate-${{ github.sha }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            ${{ env.SBOM_NAME }}
          retention-days: 14

      - name: Upload release SBOM
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flagship-lab-release-sbom-${{ steps.mode.outputs.version }}
          path: |
            ${{ env.SBOM_NAME }}
            image-digest.txt
          retention-days: 90
